name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Skip CI for Dependabot-authored events; those PRs are reviewed/merged separately.
    if: ${{ github.actor != 'dependabot[bot]' }}
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Safety net: a hung test can't burn the runner (and concurrency below
    # cancels superseded runs).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::result_large_err

      - name: Test
        run: cargo test --workspace
