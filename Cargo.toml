# cterm — a terminal integration / shim tool.
#
# This is a Cargo workspace. Crates are added incrementally as the system
# grows. The layering (inner -> outer, dependencies only point inward):
#
#   cterm-core     domain model: sessions, executions, streams, status, traits.
#   cterm-proto    gRPC/protobuf contract (tonic) — the agent-facing wire API.
#   cterm-storage  persistence of execution records (SQLite).
#   cterm-daemon   the collector: IPC server + gRPC server + storage.
#   cterm-shim     the shell shim that runs under the real shell via a PTY.
#   cterm-cli      operator CLI: install/remove the shim, status, tail.
#   cterm-web      basic webview over stored records.
[workspace]
resolver = "2"
members = [
    "crates/cterm-core",
    "crates/cterm-storage",
    "crates/cterm-shim",
    "crates/cterm-proto",
    "crates/cterm-daemon",
    "crates/cterm-cli",
    "crates/cterm-web",
    "crates/cterm-ipc",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
authors = ["Maifee Ul Asad"]
repository = "https://github.com/maifeeulasad/cterm"

[workspace.dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "1.0.58"
uuid = { version = "1.7.0", features = ["v4", "serde"] }
time = { version = "0.3.34", features = ["serde-well-known", "formatting", "parsing"] }
async-trait = "0.1.77"
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread", "sync", "macros", "io-util", "net", "time", "process", "signal"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
portable-pty = "0.9"
# Upgraded to the hyper 1.x stack (h2 0.4.16+) to resolve RUSTSEC-2026-0258.
# tonic 0.14 split prost codegen into tonic-prost-build and the codec into tonic-prost.
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
futures-core = "0.3.30"
tokio-stream = "0.1.14"
async-stream = "0.3.5"
axum = "0.8"
tower = "0.5"

# Local crates
cterm-core = { path = "crates/cterm-core" }
cterm-proto = { path = "crates/cterm-proto" }
cterm-storage = { path = "crates/cterm-storage" }
cterm-shim = { path = "crates/cterm-shim" }
cterm-ipc = { path = "crates/cterm-ipc" }

[profile.release]
lto = "thin"
strip = true
