[package]
name = "cterm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "cterm operator CLI and shell shim (install/uninstall/status, and the PATH-shim shell wrapper)."

[[bin]]
name = "cterm"
path = "src/main.rs"

[dependencies]
cterm-core.workspace = true
cterm-storage.workspace = true
cterm-shim.workspace = true
cterm-ipc.workspace = true
cterm-proto.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-std", "io-util", "time"] }
tonic.workspace = true
sha2 = "0.10"
self-replace = "1"
# OS-native secret storage: macOS Keychain, Windows Credential Manager, Linux
# Secret Service (GNOME Keyring / KWallet). Default features use whatever the
# target OS provides; no mock backend in the shipped binary.
keyring = "4"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["term", "signal"] }
terminal_size = "0.4"

[target.'cfg(windows)'.dependencies]
terminal_size = "0.4"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
